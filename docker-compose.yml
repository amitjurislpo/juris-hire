# Local PostgreSQL for JurisHire. Start with: docker compose up -d
# Port 5433 avoids clashing with any other Postgres already on 5432.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: juris_hire
      POSTGRES_USER: juris
      POSTGRES_PASSWORD: juris_local_dev
    ports:
      - "5433:5432"
    volumes:
      - juris_hire_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juris -d juris_hire"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  juris_hire_pg:
