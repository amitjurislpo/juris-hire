<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juris Screening — HR Portal &amp; Student Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#0A0E15;--ink2:#0C1119;--panel:#111723;--panel2:#161D2B;--line:#1B2231;--line2:#2A3345;
  --text:#F2EDE3;--muted:#98A1B3;--soft:#C9CFDA;--nav:#B4BCCA;
  --gold:#D6B46C;--gold2:#F0D79A;--golddim:#8C7A4E;--goldbg:#1A1710;--goldline:#5A4C2C;--goldtx:#E2CFA1;
  --warn:#F0B98C;--warnbg:#2A1E16;--blue:#9DBBEA;--bluebg:#16223A;
  --ivory:#F6F3EC;--ivory2:#FBF9F4;--ivory3:#EEE9DD;--paper:#FFFFFF;--sline:#E4DED1;--sline2:#D3CCBC;
  --sink:#121722;--smuted:#5B6271;--sbody:#4E5563;--sgold:#7E6322;--ok:#2F7A55;--danger:#C2412B;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:Manrope,'Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}a:hover{color:var(--gold2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}
h1,h2,h3,p{margin:0}
.serif{font-family:var(--serif);font-weight:400}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}

/* ---------- prototype bar ---------- */
.proto{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:rgba(10,14,21,.92);border:1px solid var(--line2);box-shadow:0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(10px);max-width:calc(100vw - 24px);overflow-x:auto}
.proto .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--golddim);padding:0 10px;white-space:nowrap}
.proto button,.proto select{height:36px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--nav);padding:0 14px;font-size:13px;font-weight:600;white-space:nowrap}
.proto button.on{background:var(--gold);color:#121722}
.proto button:hover:not(.on){background:var(--panel2);color:var(--text)}
.proto select{background:var(--panel);border-color:var(--line2);color:var(--text);max-width:220px}
.proto .sep{width:1px;height:22px;background:var(--line2);margin:0 4px}

/* ---------- toast ---------- */
.toasts{position:fixed;top:20px;right:20px;z-index:120;display:flex;flex-direction:column;gap:10px}
.toast{min-width:260px;max-width:380px;padding:14px 18px;border-radius:14px;background:var(--panel2);border:1px solid var(--goldline);color:var(--text);font-size:14px;box-shadow:0 18px 40px rgba(0,0,0,.4);animation:tin .25s ease}
.toast.light{background:var(--sink);color:var(--ivory)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(5,7,11,.72);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:20px;box-shadow:0 40px 90px rgba(0,0,0,.55)}
.modal.wide{width:min(760px,100%)}
.modal.light{background:var(--paper);border-color:var(--sline);color:var(--sink)}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.modal-h h2{font-family:var(--serif);font-weight:400;font-size:32px;line-height:36px}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.modal-f{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* ---------- HR: shared controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel2);color:var(--text);border-color:#3A4458}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#121722;font-weight:700}
.btn.gold:hover{background:var(--gold2);border-color:var(--gold2);color:#121722}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.danger{border-color:#5A3428;color:#F2C5A8}
.btn.danger:hover{background:#2A1A14}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.field>span{font-weight:600}
.input,.select,.textarea{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--ink2);color:var(--text);font-size:14px;width:100%}
.textarea{padding:12px 14px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--soft);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{border-color:var(--gold);background:#2A2414;color:var(--gold2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:#1E2636;color:var(--soft)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.st-invited{background:#1E2636;color:#B4BCCA}
.st-started{background:var(--bluebg);color:var(--blue)}
.st-completed{background:#1D2A26;color:#9FD3B8}
.st-review{background:#2A2414;color:var(--gold2)}
.st-shortlisted{background:#F0E3C0;color:#3D2F0E}
.st-interview{background:#E6D3A3;color:#3D2F0E}
.st-selected{background:var(--gold);color:#121722}
.st-rejected{background:#3B2A22;color:#F2C5A8}
.st-hold{background:#262B36;color:#C9CFDA}
.st-terminated{background:#3B2222;color:#F2B0A8}
.flag{display:inline-flex;align-items:center;gap:6px;color:var(--warn);font-size:13px;font-weight:600}
.switch{position:relative;width:44px;height:26px;border-radius:999px;border:1px solid var(--line2);background:var(--ink2);flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#4A5468;transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:#2A2414;border-color:var(--goldline)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--gold)}
.avatar{width:34px;height:34px;border-radius:50%;background:#1E2636;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;color:var(--soft)}

/* ---------- HR: login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--ink)}
.login-art{position:relative;padding:56px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line);background:
  radial-gradient(circle at 20% 15%,rgba(214,180,108,.08),transparent 40%),
  repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.025) 79px 80px),
  repeating-linear-gradient(0deg,transparent 0 79px,rgba(255,255,255,.025) 79px 80px),var(--ink2);overflow:hidden}
.login-art h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,5.4vw,80px);line-height:1;letter-spacing:-.01em;max-width:11ch}
.login-art h1 i{color:var(--gold)}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-card{width:min(420px,100%);display:flex;flex-direction:column;gap:22px}
.mark{width:44px;height:44px;border-radius:11px;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:26px;color:var(--gold);flex:none}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-size:15px;display:block}.brand small{font-size:12px;color:var(--muted)}
@media (max-width:860px){.login{grid-template-columns:1fr}.login-art{min-height:300px;padding:32px 24px;border-right:0;border-bottom:1px solid var(--line)}}

/* ---------- HR: shell ---------- */
.hr{min-height:100vh;display:flex;background:var(--ink)}
.side{width:260px;flex:none;position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line);background:var(--ink2);display:flex;flex-direction:column;gap:28px;overflow-y:auto}
.side nav{display:flex;flex-direction:column;gap:2px}
.side .grp{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:#6B7487;padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--nav);text-decoration:none;font-size:14px;font-weight:500;border:0;background:transparent;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);font-weight:700}
.nav.on svg{color:var(--gold)}
.nav .count{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#2A2414;color:var(--gold2)}
.me{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--panel)}
.me b{font-size:13px;display:block}.me small{font-size:12px;color:var(--muted)}
.me .avatar{background:#2A2414;color:var(--gold2)}
.main{flex:1;min-width:0;padding:36px 48px 120px;display:flex;flex-direction:column;gap:28px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.ph h1{font-family:var(--serif);font-weight:400;font-size:46px;line-height:50px;letter-spacing:-.005em}
.ph .acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.crumb{display:inline-flex;align-items:center;gap:8px;min-height:36px;font-size:14px;text-decoration:none;align-self:flex-start}
.card{border-radius:18px;background:var(--panel);border:1px solid #232C3D}
.card.pad{padding:24px 26px}
.card h2{font-size:16px;font-weight:700}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:16px}
.kpi{padding:22px 24px;display:flex;flex-direction:column;gap:4px}
.kpi .n{font-family:var(--serif);font-size:50px;line-height:56px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.hi{background:var(--goldbg);border-color:var(--goldline)}.kpi.hi .n{color:var(--gold2)}.kpi.hi span{color:var(--goldtx)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:16px}
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.split>.l{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.split>.r{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:24px}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:3px;background:var(--ink2)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 24px;font-size:14px}
.legend div{display:flex;align-items:center;gap:10px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;color:var(--soft)}
.prog{height:6px;border-radius:999px;background:#232C3D;overflow:hidden}.prog>div{height:100%;background:var(--gold);border-radius:999px}

/* table */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
.tbl th{text-align:left;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:#0E131C;padding:12px 16px;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{padding-left:26px}
.tbl th:last-child,.tbl td:last-child{padding-right:26px}
.tbl td{padding:14px 16px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:#141B28}
.who{display:flex;align-items:center;gap:12px}
.who b{display:block}.who small{color:var(--muted);font-size:12px}
.empty{padding:48px 24px;text-align:center;color:var(--muted);font-size:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px 26px}
.search{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:12px;background:var(--ink2);color:var(--muted);flex:1 1 260px;max-width:380px}
.search input{border:0;background:transparent;outline:none;color:var(--text);width:100%;font-size:14px}
.toolbar .select{width:auto;min-width:160px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--ink2);border:1px solid var(--line2);flex-wrap:wrap}
.tabs button{min-height:36px;padding:0 14px;border-radius:9px;border:0;background:transparent;color:var(--nav);font-size:13px;font-weight:600}
.tabs button.on{background:var(--panel2);color:var(--text)}
.check{width:18px;height:18px;accent-color:var(--gold)}

/* drive cards */
.drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px}
.drive{padding:24px;display:flex;flex-direction:column;gap:18px;text-align:left;color:var(--text);cursor:pointer;transition:border-color .15s,transform .15s}
.drive:hover{border-color:var(--goldline);transform:translateY(-2px)}
.drive h3{font-family:var(--serif);font-weight:400;font-size:28px;line-height:32px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{padding:10px 12px;border-radius:10px;background:var(--ink2);display:flex;flex-direction:column;gap:2px}
.stats3 b{font-size:18px}.stats3 span{font-size:11px;color:var(--muted)}

/* candidate detail */
.cand-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.cand-h .big{width:72px;height:72px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:30px;color:var(--gold2);flex:none}
.cand-h h1{font-family:var(--serif);font-weight:400;font-size:44px;line-height:48px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.video{position:relative;aspect-ratio:16/8;background:#05070B;display:flex;align-items:center;justify-content:center;border-radius:18px 18px 0 0;overflow:hidden}
.video video{width:100%;height:100%;object-fit:cover;background:#05070B}
.ph-person{display:flex;flex-direction:column;align-items:center;gap:10px;color:#6B7487;font-size:13px;text-align:center;padding:0 24px}
.mcqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mcq{padding:12px 14px;border-radius:12px;border:1px solid #3A4458;background:#1E2636;display:flex;flex-direction:column;gap:4px;font-size:12px;text-align:left;color:var(--text)}
.mcq.ok{background:var(--goldbg);border-color:var(--goldline)}
.mcq.ok b{color:var(--gold2)}.mcq.ok span{color:var(--goldtx)}
.mcq span{color:var(--muted)}
.ans{padding:18px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ans:first-of-type{border-top:0}
.ans p{font-size:14px;line-height:22px;color:var(--soft);white-space:pre-wrap}
.rate{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.rate button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-weight:700}
.rate button.on{background:var(--gold);border-color:var(--gold);color:#121722}
.rate button.in{background:#2A2414;border-color:var(--goldline);color:var(--gold2)}
.kv{display:grid;grid-template-columns:1fr auto;gap:12px 16px;font-size:14px}
.kv span{color:var(--muted)}
.integrity{background:var(--goldbg);border-color:var(--goldline)}
.integrity .kv span{color:var(--goldtx)}
.tl{display:flex;flex-direction:column;gap:12px;font-size:13px}
.tl div{display:grid;grid-template-columns:72px 1fr;gap:12px}
.tl .t{font-family:var(--mono);color:var(--muted)}
.tl .w,.tl .w .t{color:var(--warn)}
.hist{display:flex;flex-direction:column;gap:14px;font-size:13px}
.hist small{display:block;color:var(--muted);margin-top:2px}

/* settings */
.set-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0;padding-top:4px}
.set-row .txt{flex:1 1 300px}
.set-row .txt b{font-size:14px;display:block}
.set-row .txt small{font-size:13px;color:var(--muted);line-height:1.5}
.set-row .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--ink2)}
.stepper button{width:40px;height:42px;border:0;background:transparent;color:var(--soft);font-size:18px}
.stepper button:hover{background:var(--panel2)}
.stepper output{min-width:44px;text-align:center;font-weight:700}
.mix{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mix .card{padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--ink2)}

@media (max-width:900px){
  .hr{flex-direction:column}
  .side{position:static;width:100%;height:auto;flex-direction:row;align-items:center;padding:12px 16px;gap:12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .side nav{flex-direction:row}
  .side .grp,.me,.side .brand div{display:none}
  .nav{white-space:nowrap}
  .main{padding:24px 16px 120px}
  .ph h1{font-size:36px;line-height:40px}
  .mix{grid-template-columns:1fr}
}

/* ---------- STUDENT ---------- */
.st{min-height:100vh;background:var(--ivory);color:var(--sink);display:flex;flex-direction:column}
.st a{color:var(--sgold)}
.st-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:18px 48px;border-bottom:1px solid var(--sline);background:var(--ivory2);position:sticky;top:0;z-index:20}
.st-top .mark{background:var(--sink);border-color:var(--sink);color:var(--gold);width:38px;height:38px;font-size:22px;border-radius:9px}
.st-top .brand b{font-size:14px}.st-top .brand small{color:var(--smuted)}
.st-status{display:flex;align-items:center;gap:18px;font-size:13px;color:var(--smuted);flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.timer{font-family:var(--mono);font-size:14px;color:var(--sink);padding:8px 12px;border-radius:10px;background:var(--ivory3)}
.timer.low{background:#F7DED6;color:#8A2A18}
.st-body{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:48px 48px 120px;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start}
.st-body.narrow{max-width:820px;flex-direction:column;gap:28px}
.st-main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:28px}
.st-aside{flex:1 1 280px;display:flex;flex-direction:column;gap:20px;position:sticky;top:110px}
.st h1.q{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.2vw,42px);line-height:1.18;letter-spacing:-.005em;text-wrap:pretty}
.st .eyebrow{color:var(--sgold)}

      for (let t = 0; t < tabs; t++) events.push({ id: uid('e'), cid: c.id, at: new Date(start.getTime() + (6 + t * 4) * 60000), type: 'tab', text: `Tab hidden ${4 + t * 3}s · ${t === 0 ? 'warning shown' : 'violation rule applied'}`, warn: true });

function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildAssessment() {
  const s = DB.settings, pick = (type, n) => {
    const pool = DB.questions.filter(q => q.type === type && q.active);
    if (s.selection === 'fixed') return pool.slice(0, n);
    if (s.selection === 'partial') return [...pool.slice(0, Math.ceil(n / 2)), ...shuffle(pool.slice(Math.ceil(n / 2))).slice(0, Math.floor(n / 2))];
    return shuffle(pool).slice(0, n);
  };
  return [...pick('mcq', s.mcq), ...pick('written', s.written), ...pick('video', s.video)];
}

function bindQuestion(i) {

/* --- video recording --- */
function stopMedia() {
  if (MEDIA.tick) clearInterval(MEDIA.tick);
  if (MEDIA.rec && MEDIA.rec.state === 'recording') try { MEDIA.rec.stop(); } catch (e) { }
  if (MEDIA.stream) MEDIA.stream.getTracks().forEach(t => t.stop());
  MEDIA.stream = null;
  if (MEDIA.state === 'ready' || MEDIA.state === 'recording') MEDIA.state = 'idle';
}
function reVideo(i) { const app = $('#app'); app.innerHTML = stQuestion(i); bindQuestion(i); }
function bindVideo(q, i) {
  const v = $('#camv'); if (v && MEDIA.stream) { v.srcObject = MEDIA.stream; v.play().catch(() => { }); }
  const on = $('#camon'); if (on) on.onclick = async () => {
    if (!supportsMedia()) { MEDIA.state = 'error'; MEDIA.err = 'not supported'; logEv('perm', 'Recording not supported in this browser', true); return reVideo(i); }
    try { MEDIA.stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); MEDIA.sim = false; MEDIA.state = 'ready'; logEv('perm', 'Camera & microphone granted'); }
    catch (e) { MEDIA.state = 'error'; MEDIA.err = e.name || 'error'; logEv('perm', 'Camera / microphone unavailable (' + MEDIA.err + ')', true); }
    reVideo(i);
  };
  const sim = $('#camsim'); if (sim) sim.onclick = () => { MEDIA.sim = true; MEDIA.state = 'ready'; reVideo(i); };
  const rg = $('#recgo'); if (rg) rg.onclick = () => startRec(i);
  const rs = $('#recstop'); if (rs) rs.onclick = () => stopRec(i);
  const rt = $('#retake'); if (rt) rt.onclick = async () => {
    ST.retakesUsed++; logEv('video', 'Video retake started (' + ST.retakesUsed + ')');
    if (MEDIA.url) URL.revokeObjectURL(MEDIA.url); MEDIA.url = null; MEDIA.dur = 0;
    if (!MEDIA.sim && !MEDIA.stream) { try { MEDIA.stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); } catch (e) { MEDIA.state = 'error'; return reVideo(i); } }
    MEDIA.state = 'ready'; reVideo(i);
  };
  const vs = $('#vsave'); if (vs) vs.onclick = () => {
    ST.answers[q.id] = { dur: MEDIA.dur, url: MEDIA.url, sim: MEDIA.sim };
    logEv('video', `Video answer saved · ${MEDIA.dur}s${MEDIA.sim ? ' (simulated)' : ''}`);
    stopMedia(); location.hash = '#/student/review';
  };
}
function startRec(i) {
  const max = DB.settings.videoMax;
  MEDIA.chunks = []; MEDIA.state = 'recording'; MEDIA.t0 = Date.now();
  if (!MEDIA.sim) {
    try {
      const types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
      const mt = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
      const rec = new MediaRecorder(MEDIA.stream, mt ? { mimeType: mt } : undefined);
      MEDIA.rec = rec;
      rec.ondataavailable = e => { if (e.data && e.data.size) MEDIA.chunks.push(e.data); };
      rec.onstop = () => {
        const blob = new Blob(MEDIA.chunks, { type: rec.mimeType || 'video/webm' });
        MEDIA.url = URL.createObjectURL(blob);
        if (MEDIA.stream) { MEDIA.stream.getTracks().forEach(t => t.stop()); MEDIA.stream = null; }
        MEDIA.state = 'recorded'; reVideo(i);

    } catch (e) { MEDIA.sim = true; }

    const c = $('#ringc'), t = $('#ringt');

    <a class="sbtn" href="#/hr/candidate/c0" onclick="if(!DB.me)DB.me=DB.users[0]">See how HR sees this (prototype) ${I('right', 16)}</a>
  </div></div></div>`;
}
</script>
<script>
/* =========================================================
   HR PORTAL
   ========================================================= */
const UI = { cand: { q: '', drive: '', status: '', flagged: false, sel: new Set() }, qb: { type: 'all', q: '' }, act: { type: 'all', q: '' } };

function hrNav(active) {

    <div class="brand"><div class="mark">J</div><div><b>Juris Consultants</b><small>Talent screening</small></div></div>

      <span class="grp">RECRUITMENT</span>${items.slice(0, 3).map(n).join('')}
      <span class="grp">ASSESSMENT</span>${items.slice(3, 5).map(n).join('')}
      <span class="grp">OVERSIGHT</span>${items.slice(5).map(n).join('')}
    </nav>
    <div class="me"><div class="avatar">${initials(DB.me.name)}</div><div style="flex:1;min-width:0"><b>${esc(DB.me.name)}</b><small>${esc(DB.me.role)}</small></div><button class="x" type="button" id="logout" aria-label="Sign out" title="Sign out">${I('logout', 16)}</button></div>
  </aside>`;
}
function hrShell(active, inner) {
  $('#app').innerHTML = `<div class="hr">${hrNav(active)}<main class="main" id="hrmain">${inner}</main></div>`;
  $('#logout').onclick = () => { DB.me = null; location.hash = '#/hr/login'; };
}

function renderHR(p) {
  const page = p[0] || 'dashboard';
  if (page === 'login' || !DB.me) { if (page !== 'login') return location.replace('#/hr/login'); return hrLogin(); }
  ({ dashboard: hrDashboard, drives: hrDrives, drive: () => hrDrive(p[1]), candidates: hrCandidates, candidate: () => hrCandidate(p[1]), questions: hrQuestions, settings: hrSettings, activity: hrActivity, reports: hrReports, users: hrUsers }[page] || hrDashboard)();
}

/* ---------- login ---------- */
function hrLogin() {
  $('#app').innerHTML = `<div class="login">
    <section class="login-art">
      <div class="brand"><div class="mark">J</div><div><b>Juris Consultants</b><small>Talent screening</small></div></div>
      <div style="display:flex;flex-direction:column;gap:20px">

      </div>
      <span class="mono" style="font-size:12px;color:#6B7487">Authorised HR users only · all access is logged</span>
    </section>
    <section class="login-form"><form class="login-card" id="loginf" novalidate>
      <div><h2 class="serif" style="font-size:40px;line-height:44px">Sign in</h2><p class="muted" style="font-size:14px;margin-top:6px">Use your Juris Consultants work account.</p></div>
      <label class="field"><span>Work email</span><input class="input" type="email" id="lemail" autocomplete="username" placeholder="name@jurislpo.com" value="meera.n@jurislpo.com"></label>

      <p id="lerr" class="hidden" style="font-size:13px;color:var(--warn)"></p>

  $('#loginf').onsubmit = e => {

    DB.me = DB.users.find(u => u.email === em) || { id: 'ux', name: em.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, m => m.toUpperCase()), email: em, role: 'HR Admin' };
    DB.me.last = now();

  };
}

/* ---------- metrics ---------- */
function stats(list) {
  const by = s => list.filter(c => c.status === s).length;
  const submitted = list.filter(c => SUBMITTED.includes(c.status)).length;
  return {
    invited: list.length, submitted, started: by('started'), notStarted: by('invited'), awaiting: by('completed') + by('review'),
    shortlisted: by('shortlisted') + by('interview') + by('selected'), rejected: by('rejected'), hold: by('hold'), terminated: by('terminated'),
    flaggedAwaiting: list.filter(c => ['completed', 'review'].includes(c.status) && c.tabs).length,
    avgMcq: (() => { const s = list.filter(c => c.mcq); if (!s.length) return null; return s.reduce((a, c) => a + mcqScore(c), 0) / s.length; })()
  };
}
function mcqScore(c) { return (c.mcq || []).filter(a => { const q = qById(a.qid); return q && a.chosen === q.correct; }).length; }

function candRow(c, opts = {}) {
  const d = driveOf(c);
  const sc = c.mcq ? `<b>${mcqScore(c)}</b><span class="muted"> / ${c.mcq.length}</span>` : '<span class="muted">—</span>';
  const fl = c.tabs ? `<span class="flag">${I('warn', 14, 2)}${c.tabs} tab${c.tabs > 1 ? 's' : ''}</span>` : '<span class="muted">None</span>';
  return `<tr class="click" data-cid="${c.id}">
    ${opts.check ? `<td style="width:44px" onclick="event.stopPropagation()"><input type="checkbox" class="check" data-sel="${c.id}" ${UI.cand.sel.has(c.id) ? 'checked' : ''} aria-label="Select ${esc(c.name)}"></td>` : ''}
    <td><div class="who"><span class="avatar">${initials(c.name)}</span><div><b>${esc(c.name)}${c.demo ? ' <span class="pill st-review" style="margin-left:6px">Demo</span>' : ''}</b><small>${esc(c.email)}</small></div></div></td>
    <td style="color:var(--soft)">${esc(d.college)}<br><small class="muted">${esc(d.name)}</small></td>
    <td>${sc}</td><td>${fl}</td>
    <td class="muted">${c.submittedAt ? fmtDay(c.submittedAt) : c.startedAt ? 'In progress' : 'Not started'}</td>
    <td>${pill(c.status)}</td>
    <td style="text-align:right"><a class="btn sm" href="#/hr/candidate/${c.id}" onclick="event.stopPropagation()">${['completed', 'review'].includes(c.status) ? 'Review' : 'Open'}</a></td>
  </tr>`;
}
const candHead = check => `<thead><tr>${check ? '<th style="width:44px"><input type="checkbox" class="check" id="selall" aria-label="Select all"></th>' : ''}<th>Candidate</th><th>College / drive</th><th>MCQ</th><th>Flags</th><th>Submitted</th><th>Status</th><th></th></tr></thead>`;
function bindRows() { $$('tr[data-cid]').forEach(r => r.onclick = () => location.hash = '#/hr/candidate/' + r.dataset.cid); }

/* ---------- dashboard ---------- */
function hrDashboard() {
  const s = stats(DB.candidates);
  const pct = s.invited ? Math.round(s.submitted / s.invited * 100) : 0;
  const segs = [
    ['Not started', s.notStarted, '#3A4458'], ['In progress', s.started, '#5C7FB8'], ['Awaiting review', s.awaiting, '#8C7A4E'],
    ['Shortlisted / interview / selected', s.shortlisted, '#F0E3C0'], ['Rejected', s.rejected, '#B5684A'], ['On hold', s.hold, '#6B7487'], ['Terminated', s.terminated, '#7A3A33']
  ];
  const awaiting = DB.candidates.filter(c => ['completed', 'review'].includes(c.status)).sort((a, b) => b.submittedAt - a.submittedAt).slice(0, 6);
  const recent = [...DB.events].sort((a, b) => b.at - a.at).slice(0, 7);
  const active = DB.drives.filter(d => d.status === 'Active');
  const hr = new Date().getHours();
  hrShell('dashboard', `
    <header class="ph"><div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Sales team · College hiring</span><h1>Good ${hr < 12 ? 'morning' : hr < 17 ? 'afternoon' : 'evening'}, ${esc(DB.me.name.split(' ')[0])}</h1></div>
      <div class="acts"><a class="btn" href="#/hr/candidates">${I('upload', 16)} Import students</a><button class="btn gold" type="button" id="newdrive">${I('plus', 16)} New hiring drive</button></div></header>
    <section class="kpis" aria-label="Key figures">
      <div class="card kpi"><span>Invited</span><b class="n">${s.invited}</b><span>across ${active.length} active drive${active.length !== 1 ? 's' : ''}</span></div>
      <div class="card kpi"><span>Assessments submitted</span><b class="n">${s.submitted}</b><span>${pct}% of invited</span></div>
      <div class="card kpi hi"><span>Awaiting HR review</span><b class="n">${s.awaiting}</b><span>${s.flaggedAwaiting} with activity flags</span></div>
      <div class="card kpi"><span>Shortlisted for interview</span><b class="n">${s.shortlisted}</b><span>${s.submitted ? Math.round(s.shortlisted / s.submitted * 100) : 0}% of submitted</span></div>
    </section>
    <div class="cols">
      <section class="card pad" style="display:flex;flex-direction:column;gap:22px"><div class="card-h"><h2>Recruitment pipeline</h2><span class="muted" style="font-size:13px">All drives</span></div>
        <div class="bar">${segs.filter(x => x[1]).map(x => `<div style="flex:${x[1]};background:${x[2]}" title="${x[0]}: ${x[1]}"></div>`).join('')}</div>
        <div class="legend">${segs.map(x => `<div><i style="background:${x[2]}"></i><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
      </section>
      <section class="card pad" style="display:flex;flex-direction:column;gap:14px"><div class="card-h"><h2>Active hiring drives</h2><a href="#/hr/drives" style="font-size:13px;text-decoration:none">View all</a></div>
        ${active.map(d => { const l = DB.candidates.filter(c => c.driveId === d.id), st = stats(l), p = l.length ? Math.round(st.submitted / l.length * 100) : 0; return `<a href="#/hr/drive/${d.id}" style="display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--text)"><span><b style="font-size:14px;display:block">${esc(d.college)} · ${esc(d.name)}</b><small class="muted">Closes ${fmtDate(d.closes)} · ${l.length} invited</small></span><span class="prog"><div style="width:${p}%"></div></span><span style="font-size:13px;text-align:right">${p}%</span></a>`; }).join('')}
      </section>
    </div>
    <div style="display:flex;flex-direction:column;gap:24px">
      <section class="card" style="overflow:hidden"><div class="toolbar"><h2 style="font-size:16px;font-weight:700;flex:1">Awaiting review</h2><a class="btn sm" href="#/hr/candidates">All candidates</a></div>
        <div class="tbl-wrap"><table class="tbl">${candHead(false)}<tbody>${awaiting.map(c => candRow(c)).join('') || `<tr><td colspan="7" class="empty">Nothing waiting — you’re up to date.</td></tr>`}</tbody></table></div></section>
      <section class="card pad" style="display:flex;flex-direction:column;gap:16px"><div class="card-h"><h2>Recent activity</h2><a href="#/hr/activity" style="font-size:13px;text-decoration:none">Full log</a></div>
        <div class="tl" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px 32px">${recent.map(e => { const c = DB.candidates.find(x => x.id === e.cid); return `<div class="${e.warn ? 'w' : ''}"><span class="t">${fmtT(e.at)}</span><span><b style="color:var(--text)">${esc(c ? c.name : '—')}</b><br>${esc(e.text)}</span></div>`; }).join('')}</div></section>
    </div>`);
  bindRows();
  $('#newdrive').onclick = newDriveModal;
}

/* ---------- drives ---------- */
function hrDrives() {
  hrShell('drives', `
    <header class="ph"><div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">${DB.drives.length} drives</span><h1>Hiring drives</h1></div>
      <div class="acts"><button class="btn gold" type="button" id="newdrive">${I('plus', 16)} New hiring drive</button></div></header>
    <div class="drives">${DB.drives.map(d => {
      const l = DB.candidates.filter(c => c.driveId === d.id), s = stats(l), p = l.length ? Math.round(s.submitted / l.length * 100) : 0;
      return `<a class="card drive" href="#/hr/drive/${d.id}" style="text-decoration:none">
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">${esc(d.college)}</span><span class="pill ${d.status === 'Active' ? 'st-completed' : d.status === 'Draft' ? 'st-review' : 'st-hold'}">${d.status}</span></div>
        <h3>${esc(d.name)}</h3>
        <span class="muted" style="font-size:13px">Session ${fmtDate(d.date)} · closes ${fmtDate(d.closes)}</span>
        <div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;font-size:13px"><span class="muted">Completion</span><b>${p}%</b></div><div class="prog"><div style="width:${p}%"></div></div></div>
        <div class="stats3"><div><b>${l.length}</b><span>Invited</span></div><div><b>${s.awaiting}</b><span>To review</span></div><div><b>${s.shortlisted}</b><span>Shortlisted</span></div></div>
      </a>`;
    }).join('')}</div>`);
  $('#newdrive').onclick = newDriveModal;
}
function newDriveModal() {
  openModal(`<div class="modal-h"><h2>New hiring drive</h2><button class="x" type="button" data-close aria-label="Close">${I('x', 16)}</button></div>
    <form id="dform" style="display:flex;flex-direction:column;gap:16px">
      <label class="field"><span>Drive name</span><input class="input" id="dn" required placeholder="e.g. Sales Associate · Batch 3"></label>
      <div class="grid2"><label class="field"><span>College</span><input class="input" id="dc" required placeholder="College name"></label><label class="field"><span>City</span><input class="input" id="dcity" placeholder="City"></label></div>
      <div class="grid2"><label class="field"><span>Session date</span><input class="input" type="date" id="dd" required></label><label class="field"><span>Link closes</span><input class="input" type="date" id="dclose" required></label></div>
      <p class="muted" style="font-size:13px">Uses the current assessment rules: ${DB.settings.mcq} MCQ · ${DB.settings.written} written · ${DB.settings.video} video. <a href="#/hr/settings">Change rules</a></p>
      <div class="modal-f"><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn gold" type="submit">Create drive</button></div>
    </form>`);
  const t = new Date(), c = new Date(); c.setDate(t.getDate() + 7);
  $('#dd').value = t.toISOString().slice(0, 10); $('#dclose').value = c.toISOString().slice(0, 10);
  $('#dform').onsubmit = e => {
    e.preventDefault();
    const n = $('#dn').value.trim(), col = $('#dc').value.trim();
    if (!n || !col) return toast('Add a drive name and college.');
    const d = { id: uid('d'), name: n, college: col, city: $('#dcity').value.trim() || '—', date: $('#dd').value, closes: $('#dclose').value, status: 'Draft' };
    DB.drives.push(d); closeModal(); toast(`Drive “${esc(n)}” created. Import students to send invitations.`);
    location.hash = '#/hr/drive/' + d.id;
  };
}
function hrDrive(id) {
  const d = DB.drives.find(x => x.id === id) || DB.drives[0];
  const l = DB.candidates.filter(c => c.driveId === d.id), s = stats(l);
  hrShell('drives', `
    <a class="crumb" href="#/hr/drives">${I('left', 16)} Hiring drives</a>
    <header class="ph"><div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">${esc(d.college)} · ${esc(d.city)}</span><h1>${esc(d.name)}</h1>
      <div class="meta"><span>Session ${fmtDate(d.date)}</span><span>Link closes ${fmtDate(d.closes)}</span><span class="pill ${d.status === 'Active' ? 'st-completed' : d.status === 'Draft' ? 'st-review' : 'st-hold'}">${d.status}</span></div></div>
      <div class="acts">${d.status !== 'Closed' ? `<button class="btn" type="button" id="dclosebtn">Close drive</button>` : ''}<button class="btn" type="button" id="dimport">${I('upload', 16)} Import students</button><button class="btn gold" type="button" id="dinvite">${I('send', 16)} Send ${s.notStarted} invitation${s.notStarted !== 1 ? 's' : ''}</button></div></header>
    <section class="kpis">
      <div class="card kpi"><span>Invited</span><b class="n">${s.invited}</b><span>${s.notStarted} not started</span></div>
      <div class="card kpi"><span>Submitted</span><b class="n">${s.submitted}</b><span>${s.invited ? Math.round(s.submitted / s.invited * 100) : 0}% completion</span></div>
      <div class="card kpi hi"><span>To review</span><b class="n">${s.awaiting}</b><span>${s.flaggedAwaiting} flagged</span></div>
      <div class="card kpi"><span>Average MCQ</span><b class="n">${s.avgMcq === null ? '—' : s.avgMcq.toFixed(1)}</b><span>out of ${DB.settings.mcq}</span></div>
    </section>
    <section class="card" style="overflow:hidden"><div class="toolbar"><h2 style="font-size:16px;font-weight:700;flex:1">Candidates in this drive</h2></div>
      <div class="tbl-wrap"><table class="tbl">${candHead(false)}<tbody>${l.map(c => candRow(c)).join('') || `<tr><td colspan="7" class="empty">No students yet. Import a list to get started.</td></tr>`}</tbody></table></div></section>`);
  bindRows();
  $('#dimport').onclick = () => importModal(d.id);
  $('#dinvite').onclick = () => { if (!s.notStarted) return toast('Everyone in this drive has already started.'); if (d.status === 'Draft') d.status = 'Active'; toast(`${s.notStarted} invitation email${s.notStarted > 1 ? 's' : ''} queued for sending.`); hrDrive(d.id); };
  const cb = $('#dclosebtn'); if (cb) cb.onclick = () => { d.status = 'Closed'; toast('Drive closed — links no longer accept new attempts.'); hrDrive(d.id); };
}

/* ---------- candidates ---------- */
function hrCandidates() {
  const f = UI.cand;
  const list = DB.candidates.filter(c => {
    const d = driveOf(c);
    if (f.q && !(c.name + ' ' + c.email + ' ' + d.college).toLowerCase().includes(f.q.toLowerCase())) return false;
    if (f.drive && c.driveId !== f.drive) return false;
    if (f.status && c.status !== f.status) return false;
    if (f.flagged && !c.tabs) return false;
    return true;
  }).sort((a, b) => (b.submittedAt || b.startedAt || 0) - (a.submittedAt || a.startedAt || 0));
  const selN = f.sel.size;
  hrShell('candidates', `
    <header class="ph"><div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">${DB.candidates.length} students</span><h1>Candidates</h1></div>
      <div class="acts"><button class="btn" type="button" id="cexport">${I('download', 16)} Export CSV</button><button class="btn gold" type="button" id="cimport">${I('upload', 16)} Import students</button></div></header>
    <section class="card" style="overflow:hidden">
      <div class="toolbar">
        <label class="search">${I('search', 16, 2)}<span class="sr">Search</span><input type="search" id="cq" placeholder="Search name, email, college…" value="${esc(f.q)}"></label>
        <label class="sr" for="cdrive">Drive</label><select class="select" id="cdrive"><option value="">All drives</option>${DB.drives.map(d => `<option value="${d.id}" ${f.drive === d.id ? 'selected' : ''}>${esc(d.college)} · ${esc(d.name)}</option>`).join('')}</select>
        <label class="sr" for="cstatus">Status</label><select class="select" id="cstatus"><option value="">All statuses</option>${STATUS.map(s => `<option value="${s[0]}" ${f.status === s[0] ? 'selected' : ''}>${s[1]}</option>`).join('')}</select>
        <button type="button" class="chip ${f.flagged ? 'on' : ''}" id="cflag" aria-pressed="${f.flagged}">${I('warn', 14, 2)}&nbsp;Flagged only</button>
        <span style="flex:1"></span>
        <span class="muted" style="font-size:13px">${list.length} shown</span>
      </div>
      ${selN ? `<div class="toolbar" style="background:var(--goldbg);border-top:1px solid var(--goldline);padding:12px 26px"><b style="font-size:14px;color:var(--gold2)">${selN} selected</b><span style="flex:1"></span>
        <button class="btn sm" type="button" id="bulkinvite">${I('send', 14)} Resend invitation</button>
        <label class="sr" for="bulkstatus">Set status</label><select class="select" id="bulkstatus" style="min-height:36px;min-width:180px"><option value="">Set status…</option>${STATUS.filter(s => !['started', 'terminated'].includes(s[0])).map(s => `<option value="${s[0]}">${s[1]}</option>`).join('')}</select>
        <button class="btn sm ghost" type="button" id="bulkclear">Clear</button></div>` : ''}
      <div class="tbl-wrap"><table class="tbl">${candHead(true)}<tbody>${list.map(c => candRow(c, { check: true })).join('') || `<tr><td colspan="8" class="empty">No candidates match these filters.</td></tr>`}</tbody></table></div>
    </section>`);
  bindRows();
  const q = $('#cq'); q.oninput = () => { f.q = q.value; const pos = q.selectionStart; hrCandidates(); const n = $('#cq'); n.focus(); n.setSelectionRange(pos, pos); };
  $('#cdrive').onchange = e => { f.drive = e.target.value; hrCandidates(); };
  $('#cstatus').onchange = e => { f.status = e.target.value; hrCandidates(); };
  $('#cflag').onclick = () => { f.flagged = !f.flagged; hrCandidates(); };
  $$('[data-sel]').forEach(b => b.onchange = () => { b.checked ? f.sel.add(b.dataset.sel) : f.sel.delete(b.dataset.sel); hrCandidates(); });
  $('#selall').checked = list.length > 0 && list.every(c => f.sel.has(c.id));
  $('#selall').onchange = e => { list.forEach(c => e.target.checked ? f.sel.add(c.id) : f.sel.delete(c.id)); hrCandidates(); };

  if (selN) {

  }
}
function importModal(driveId) {

      <label class="field"><span>Paste CSV — name, email, phone (one student per line)</span><textarea class="textarea" id="icsv" rows="7" placeholder="Name, email, phone">Asha Pillai, asha.p@example.edu, +91 [phone]

  const upd = () => { const r = parse(), bad = $('#icsv').value.split('\n').filter(l => l.trim()).length - r.length; $('#iprev').innerHTML = `${r.length} valid row${r.length !== 1 ? 's' : ''}${bad > 0 ? ` · <span style="color:var(--warn)">${bad} skipped (missing name or email)</span>` : ''}. Each student gets a unique assessment link.`; };

    const d = DB.drives.find(x => x.id === did); if ($('#isend').checked && d.status === 'Draft') d.status = 'Active';

/* ---------- candidate detail ---------- */
function hrCandidate(id) {
  const c = DB.candidates.find(x => x.id === id) || DB.candidates[1];
  if (c.status === 'completed' && c.submittedAt) setStatus(c, 'review'); // opening a completed assessment moves it into HR review
  const d = driveOf(c);
  const ev = DB.events.filter(e => e.cid === c.id).sort((a, b) => a.at - b.at);
  const submitted = !!c.submittedAt;
  const rated = Object.entries(c.ratings || {}).filter(([k]) => k !== 'video').map(([, v]) => v);
  const avg = rated.length ? (rated.reduce((a, b) => a + b, 0) / rated.length).toFixed(1) : '—';
  const rateBtns = key => { const v = c.ratings[key]; return `<div class="rate"><span>Reviewer rating</span>${[1, 2, 3, 4, 5].map(n => `<button type="button" data-rate="${key}" data-v="${n}" class="${v === n ? 'on' : v && n < v ? 'in' : ''}" aria-label="Rate ${n} of 5" aria-pressed="${v === n}">${n}</button>`).join('')}${v ? '' : '<span>Not rated</span>'}</div>`; };
  let left = '';
  if (submitted) {
    const vq = qById(c.videoQ);
    const vid = c.videoUrl ? `<video src="${c.videoUrl}" controls playsinline></video>` : `<div class="ph-person">${I('person', 56, 1.2)}<span>${c.videoSim ? 'Simulated recording — no camera was used in this demo' : 'Sample candidate · video file not included in the prototype'}</span></div>
      <button type="button" class="btn gold" aria-label="Play video response" style="position:absolute;left:24px;bottom:24px;width:56px;height:56px;border-radius:50%;padding:0" onclick="toast('In the live system the stored video streams here via a signed URL.')">${I('play', 20)}</button>`;
    left = `
      <section class="card" style="overflow:hidden"><div class="video">${vid}<span class="mono" style="position:absolute;right:20px;top:20px;font-size:12px;background:var(--ink);padding:6px 10px;border-radius:8px">${c.videoDur || 0}s of ${DB.settings.videoMax}s</span></div>
        <div style="padding:22px 26px;display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Video response</span><b style="font-size:16px;line-height:24px">${esc(vq ? vq.text : '')}</b>${rateBtns('video')}</div></section>
      <section class="card pad" style="display:flex;flex-direction:column;gap:18px">
        <div class="card-h"><h2>Multiple choice</h2><span class="serif" style="font-size:34px">${mcqScore(c)}<span class="muted"> / ${c.mcq.length}</span></span></div>
        <div class="mcqs">${c.mcq.map((a, k) => { const q = qById(a.qid), ok = q && a.chosen === q.correct; return `<div class="mcq ${ok ? 'ok' : ''}"><b>Q${k + 1} · ${esc(q ? q.cat : '')}</b><span>${a.chosen === null ? 'Not answered' : ok ? 'Correct' : 'Incorrect'}</span></div>`; }).join('')}</div>
        <details><summary style="cursor:pointer;font-size:14px;font-weight:600;color:var(--gold);min-height:32px;display:flex;align-items:center">Show questions and chosen answers</summary>
          <div style="display:flex;flex-direction:column;gap:14px;margin-top:12px">${c.mcq.map((a, k) => { const q = qById(a.qid); if (!q) return ''; const ok = a.chosen === q.correct; return `<div style="padding:14px 16px;border-radius:12px;background:var(--ink2);display:flex;flex-direction:column;gap:6px;font-size:14px"><b>${k + 1}. ${esc(q.text)}</b><span style="color:${ok ? 'var(--gold2)' : 'var(--warn)'}">${ok ? '✓' : '✗'} ${a.chosen === null ? 'No answer' : esc(q.options[a.chosen])}</span>${ok ? '' : `<span class="muted">Correct: ${esc(q.options[q.correct])}</span>`}</div>`; }).join('')}</div></details>

      </section>`;
  } else {

      <p class="muted" style="font-size:15px;line-height:1.6;max-width:60ch">${msg[1]}</p>
      <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:var(--ink2);font-family:var(--mono);font-size:13px;flex-wrap:wrap;max-width:100%"><span class="muted">Link</span><span style="word-break:break-all">assess.jurislpo.com/s/${esc(c.token)}</span></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="button" onclick="toast('Invitation email resent to ${esc(c.email)}.')">${I('send', 16)} Resend invitation</button><button class="btn" type="button" onclick="navigator.clipboard&&navigator.clipboard.writeText('https://assess.jurislpo.com/s/${esc(c.token)}');toast('Link copied.')">${I('copy', 16)} Copy link</button>${c.status === 'terminated' ? `<button class="btn gold" type="button" id="reallow">${I('refresh', 16)} Allow a new attempt</button>` : ''}${c.demo && c.status === 'invited' ? `<a class="btn gold" href="#/student/email">Take it as the student (prototype)</a>` : ''}</div>

      <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px">
        <label class="field" style="font-size:12px">Status<select class="select" id="cstat" style="min-width:210px;background:var(--goldbg);border-color:var(--goldline);color:var(--gold2)">${STATUS.map(s => `<option value="${s[0]}" ${c.status === s[0] ? 'selected' : ''}>${s[1]}</option>`).join('')}</select></label>
        ${submitted ? `<button class="btn danger" type="button" data-to="rejected">Reject</button><button class="btn" type="button" data-to="hold">Hold</button><button class="btn gold" type="button" data-to="shortlisted">Shortlist for interview</button>` : ''}
      </div>
    </header>
    <div class="split">
      <div class="l">${left}</div>
      <div class="r">
        <section class="card pad integrity" style="display:flex;flex-direction:column;gap:16px"><div style="display:flex;align-items:center;gap:10px;color:var(--gold2)">${I('shield', 18)}<h2 style="color:var(--gold2)">Assessment integrity</h2></div>
          <div class="kv"><span>Tab switches</span><b style="color:${c.tabs ? 'var(--warn)' : 'var(--text)'}">${c.tabs || 0}${c.tabs ? (c.status === 'terminated' ? ' · terminated' : ' · warned') : ''}</b>
          <span>Device</span><b>${esc(c.device || '—')}</b>
          <span>Camera / mic</span><b>${submitted ? (c.videoSim ? 'Simulated' : 'Granted') : '—'}</b>
          <span>Reconnects</span><b>${ev.filter(e => e.type === 'reconnect').length}</b>
          <span>Time taken</span><b>${c.duration ? c.duration + ' min' : '—'}</b></div>
          <p style="font-size:12px;line-height:1.5;color:var(--goldtx)">Signals for review, not proof. Browser monitoring can’t detect a second device.</p>

        <section class="card pad" style="display:flex;flex-direction:column;gap:16px"><h2>Status history</h2>

          <label class="sr" for="note">Add a note</label><textarea class="textarea" id="note" rows="3" placeholder="Add a note for the interview panel…"></textarea>
          <button class="btn sm" type="button" id="addnote" style="align-self:flex-end">Add note</button></section>

  const change = to => { const from = c.status; setStatus(c, to); toast(`${esc(c.name)} moved from ${SL[from]} to <b>${SL[to]}</b>.`); hrCandidate(c.id); };

  $('#addnote').onclick = () => { const t = $('#note').value.trim(); if (!t) return; c.notes.push({ text: t, by: DB.me.name, at: now() }); hrCandidate(c.id); };

/* ---------- question bank ---------- */
function hrQuestions() {
  const f = UI.qb;
  const list = DB.questions.filter(q => (f.type === 'all' || q.type === f.type) && (!f.q || (q.text + q.cat).toLowerCase().includes(f.q.toLowerCase())));
  const cnt = t => DB.questions.filter(q => q.type === t && q.active).length;
  const tn = { mcq: 'MCQ', written: 'Written', video: 'Video' };
  hrShell('questions', `
    <header class="ph"><div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">${DB.questions.length} questions · ${DB.questions.filter(q => q.active).length} active</span><h1>Question bank</h1></div>
      <div class="acts"><button class="btn gold" type="button" id="addq">${I('plus', 16)} Add question</button></div></header>
    <section class="kpis">
      ${['mcq', 'written', 'video'].map(t => { const need = DB.settings[t], have = cnt(t), ok = have >= need; return `<div class="card kpi ${ok ? '' : 'hi'}"><span>${tn[t]} · active</span><b class="n">${have}</b><span>${ok ? `${need} drawn per candidate${DB.settings.selection !== 'fixed' && have > need ? ' · randomised' : ''}` : `Need at least ${need} — add more`}</span></div>`; }).join('')}
    </section>
    <section class="card" style="overflow:hidden">
      <div class="toolbar"><div class="tabs" role="tablist">${[['all', 'All'], ['mcq', 'MCQ'], ['written', 'Written'], ['video', 'Video']].map(t => `<button type="button" role="tab" aria-selected="${f.type === t[0]}" class="${f.type === t[0] ? 'on' : ''}" data-qt="${t[0]}">${t[1]}</button>`).join('')}</div>
        <label class="search">${I('search', 16, 2)}<span class="sr">Search questions</span><input type="search" id="qq" placeholder="Search questions…" value="${esc(f.q)}"></label></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Question</th><th>Type</th><th>Category</th><th>Answer key</th><th>Active</th><th></th></tr></thead><tbody>
        ${list.map(q => `<tr><td style="max-width:520px"><b style="font-weight:600;line-height:1.5">${esc(q.text)}</b></td><td><span class="pill">${tn[q.type]}</span></td><td class="muted">${esc(q.cat)}</td>
          <td class="muted" style="max-width:220px">${q.type === 'mcq' ? esc(q.options[q.correct]) : q.type === 'written' ? 'Manual review' : 'Manual review · ' + DB.settings.videoMax + 's'}</td>
          <td><button type="button" class="switch" role="switch" aria-checked="${q.active}" aria-label="Active" data-tog="${q.id}"></button></td>
          <td style="text-align:right"><button class="btn sm" type="button" data-edit="${q.id}">${I('edit', 14)} Edit</button></td></tr>`).join('') || '<tr><td colspan="6" class="empty">No questions match.</td></tr>'}
      </tbody></table></div></section>`);
  $$('[data-qt]').forEach(b => b.onclick = () => { f.type = b.dataset.qt; hrQuestions(); });
  const qq = $('#qq'); qq.oninput = () => { f.q = qq.value; const p = qq.selectionStart; hrQuestions(); const n = $('#qq'); n.focus(); n.setSelectionRange(p, p); };
  $$('[data-tog]').forEach(b => b.onclick = () => { const q = qById(b.dataset.tog); q.active = !q.active; hrQuestions(); });
  $$('[data-edit]').forEach(b => b.onclick = () => questionModal(qById(b.dataset.edit)));
  $('#addq').onclick = () => questionModal(null);
}
function questionModal(q) {
  const isNew = !q; q = q || { type: 'mcq', cat: '', text: '', options: ['', '', '', ''], correct: 0, active: true };
  const body = t => t === 'mcq' ? `<div class="field"><span>Options — select the correct one</span>${[0, 1, 2, 3].map(k => `<div style="display:flex;gap:10px;align-items:center"><input type="radio" name="qcorrect" value="${k}" class="check" ${q.correct === k ? 'checked' : ''} aria-label="Option ${'ABCD'[k]} is correct"><span class="mono" style="width:16px">${'ABCD'[k]}</span><input class="input" data-opt="${k}" value="${esc((q.options || [])[k] || '')}" placeholder="Option ${'ABCD'[k]}"></div>`).join('')}</div>`
    : `<p class="muted" style="font-size:13px">${t === 'video' ? `Candidates record one answer of up to ${DB.settings.videoMax} seconds. Reviewed manually.` : `Free-text answer${DB.settings.wordLimit ? `, up to ${DB.settings.wordLimit} words` : ''}. Reviewed manually.`}</p>`;
  openModal(`<div class="modal-h"><h2>${isNew ? 'Add question' : 'Edit question'}</h2><button class="x" type="button" data-close aria-label="Close">${I('x', 16)}</button></div>
    <form id="qform" style="display:flex;flex-direction:column;gap:16px">
      <div class="grid2"><label class="field"><span>Type</span><select class="select" id="qtype" ${isNew ? '' : 'disabled'}><option value="mcq">Multiple choice</option><option value="written">Written</option><option value="video">Video</option></select></label>
      <label class="field"><span>Category</span><input class="input" id="qcat" value="${esc(q.cat)}" placeholder="e.g. Sales judgement"></label></div>
      <label class="field"><span>Question</span><textarea class="textarea" id="qtext" rows="3" placeholder="Write the question…">${esc(q.text)}</textarea></label>
      <div id="qbody">${body(q.type)}</div>
      <label style="display:flex;gap:10px;align-items:center;font-size:14px;color:var(--soft)"><input type="checkbox" class="check" id="qact" ${q.active ? 'checked' : ''}> Active — can be drawn into assessments</label>
      <div class="modal-f">${isNew ? '' : '<button class="btn danger" type="button" id="qdel" style="margin-right:auto">Delete</button>'}<button class="btn ghost" type="button" data-close>Cancel</button><button class="btn gold" type="submit">Save question</button></div>
    </form>`, { cls: 'wide' });
  $('#qtype').value = q.type;
  $('#qtype').onchange = e => $('#qbody').innerHTML = body(e.target.value);
  const del = $('#qdel'); if (del) del.onclick = () => { DB.questions = DB.questions.filter(x => x !== q); closeModal(); toast('Question deleted.'); hrQuestions(); };
  $('#qform').onsubmit = e => {
    e.preventDefault();
    const type = $('#qtype').value, text = $('#qtext').value.trim();
    if (!text) return toast('Write the question text.');
    const o = { ...q, type, text, cat: $('#qcat').value.trim() || 'General', active: $('#qact').checked };
    if (type === 'mcq') { o.options = $$('[data-opt]').map(i => i.value.trim()); if (o.options.some(x => !x)) return toast('Fill in all four options.'); o.correct = +($('input[name=qcorrect]:checked') || { value: 0 }).value; }
    if (isNew) { o.id = uid(type[0]); DB.questions.push(o); } else Object.assign(q, o);
    closeModal(); toast(isNew ? 'Question added to the bank.' : 'Question updated.'); hrQuestions();
  };
}

  const row = (t, d, ctl) => `<div class="set-row"><div class="txt"><b>${t}</b><small>${d}</small></div><div class="ctl">${ctl}</div></div>`;
  hrShell('settings', `
    <header class="ph"><div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Applies to new attempts</span><h1>Assessment rules</h1></div>
      <div class="acts"><a class="btn" href="#/student/rules">Preview as student</a></div></header>
    <div class="split"><div class="l">
      <section class="card pad"><div class="card-h" style="margin-bottom:16px"><h2>Question mix</h2><span class="muted" style="font-size:13px">${s.mcq + s.written + s.video} questions per candidate</span></div>
        <div class="mix">
          <div class="card"><span class="eyebrow">Multiple choice</span>${step('mcq')}<small class="muted">${DB.questions.filter(q => q.type === 'mcq' && q.active).length} active in bank</small></div>
          <div class="card"><span class="eyebrow">Written</span>${step('written')}<small class="muted">${DB.questions.filter(q => q.type === 'written' && q.active).length} active in bank</small></div>
          <div class="card"><span class="eyebrow">Video</span>${step('video')}<small class="muted">${DB.questions.filter(q => q.type === 'video' && q.active).length} active in bank</small></div>
        </div>
        <div style="margin-top:12px">${row('Question selection', 'How each candidate’s set is drawn from the bank.', seg('selection', [['random', 'Fully random'], ['partial', 'Partly random'], ['fixed', 'Fixed']]))}</div>
      </section>
      <section class="card pad"><h2 style="margin-bottom:8px">Timing &amp; resume</h2>
        ${row('Overall time limit', 'Auto-submits when time runs out.', seg('timeLimit', [[0, 'None'], [20, '20 min'], [30, '30 min'], [45, '45 min']]))}
        ${row('Allow resume after interruption', 'Answers are saved; reopening the link continues the attempt.', sw('resume'))}
      </section>
      <section class="card pad"><h2 style="margin-bottom:8px">Tab &amp; device monitoring</h2>
        ${row('Warnings before the rule applies', 'The first switches show a warning and are logged.', step('warnings'))}
        ${row('After warnings are used up', 'What happens on the next tab or window switch.', seg('onViolation', [['terminate', 'Terminate'], ['reset', 'Reset'], ['flag', 'Flag only']]))}
        ${row('Block phones and tablets', 'Show a desktop-required screen and log the attempt.', sw('blockMobile'))}
      </section>
      <section class="card pad"><h2 style="margin-bottom:8px">Responses</h2>
        ${row('Video length limit', 'Recording stops automatically.', seg('videoMax', [[10, '10s'], [15, '15s'], [20, '20s'], [30, '30s']]))}
        ${row('Video retakes', 'Times a candidate can re-record before submitting.', seg('retakes', [[0, 'None'], [1, '1'], [2, '2']]))}
        ${row('Written answer word limit', 'Shown with a live counter.', seg('wordLimit', [[0, 'None'], [100, '100'], [150, '150'], [250, '250']]))}
      </section>
    </div>
    <div class="r">
      <section class="card pad" style="display:flex;flex-direction:column;gap:14px;position:sticky;top:24px"><span class="eyebrow">Candidate sees</span>
        <b class="serif" style="font-size:28px;line-height:32px">${s.mcq} MCQ · ${s.written} written · ${s.video} video</b>
        <div class="kv"><span>Time limit</span><b>${s.timeLimit ? s.timeLimit + ' min' : 'None'}</b><span>Warnings</span><b>${s.warnings}</b><span>Then</span><b>${{ terminate: 'Terminate', reset: 'Reset', flag: 'Flag for HR' }[s.onViolation]}</b><span>Video</span><b>${s.videoMax}s · ${s.retakes} retake${s.retakes !== 1 ? 's' : ''}</b><span>Word limit</span><b>${s.wordLimit || 'None'}</b><span>Mobile</span><b>${s.blockMobile ? 'Blocked' : 'Allowed'}</b></div>
        <p class="muted" style="font-size:12px;line-height:1.5">Changes save instantly in this prototype and apply to the next attempt started in the student app.</p>
      </section>
    </div></div>`);
  const lim = { mcq: [1, 15], written: [0, 6], video: [0, 2], warnings: [0, 3] };
  $$('[data-step]').forEach(b => b.onclick = () => { const k = b.dataset.step, [mn, mx] = lim[k]; s[k] = Math.max(mn, Math.min(mx, s[k] + +b.dataset.d)); hrSettings(); });
  $$('[data-sw]').forEach(b => b.onclick = () => { s[b.dataset.sw] = !s[b.dataset.sw]; hrSettings(); });
  $$('[data-seg]').forEach(b => b.onclick = () => { const k = b.dataset.seg, v = b.dataset.v; s[k] = isNaN(+v) ? v : +v; hrSettings(); });
}

/* ---------- activity ---------- */
function hrActivity() {
  const f = UI.act;
  const groups = { all: null, tab: ['tab', 'terminated'], device: ['device', 'eligible', 'reconnect'], media: ['perm', 'video'], lifecycle: ['start', 'submit'] };
  const list = [...DB.events].filter(e => (!groups[f.type] || groups[f.type].includes(e.type))).filter(e => { const c = DB.candidates.find(x => x.id === e.cid); return !f.q || ((c ? c.name : '') + ' ' + e.text).toLowerCase().includes(f.q.toLowerCase()); }).sort((a, b) => b.at - a.at);
  const flagged = DB.events.filter(e => e.warn).length;
  const tlabel = { tab: 'Tab switch', terminated: 'Terminated', device: 'Device', eligible: 'Eligibility', reconnect: 'Reconnect', perm: 'Permissions', video: 'Video', start: 'Lifecycle', submit: 'Lifecycle' };
  hrShell('activity', `
    <header class="ph"><div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">${DB.events.length} events · ${flagged} flagged</span><h1>Activity &amp; violation log</h1></div>
      <div class="acts"><button class="btn" type="button" id="aexport">${I('download', 16)} Export log</button></div></header>
    <section class="card" style="overflow:hidden">
      <div class="toolbar"><div class="tabs">${[['all', 'All'], ['tab', 'Tab switches'], ['device', 'Device'], ['media', 'Camera & video'], ['lifecycle', 'Start / submit']].map(t => `<button type="button" class="${f.type === t[0] ? 'on' : ''}" data-at="${t[0]}" aria-pressed="${f.type === t[0]}">${t[1]}</button>`).join('')}</div>
        <label class="search">${I('search', 16, 2)}<span class="sr">Search log</span><input type="search" id="aq" placeholder="Search candidate or event…" value="${esc(f.q)}"></label></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Time</th><th>Candidate</th><th>Type</th><th>Event</th><th></th></tr></thead><tbody>
        ${list.map(e => { const c = DB.candidates.find(x => x.id === e.cid); return `<tr class="click" data-cid="${e.cid}"><td class="mono muted" style="white-space:nowrap">${fmtDay(e.at)}:${pad(e.at.getSeconds())}</td><td><b>${esc(c ? c.name : '—')}</b></td><td><span class="pill ${e.warn ? 'st-rejected' : ''}">${tlabel[e.type] || e.type}</span></td><td style="color:${e.warn ? 'var(--warn)' : 'var(--soft)'}">${esc(e.text)}</td><td style="text-align:right"><a class="btn sm" href="#/hr/candidate/${e.cid}" onclick="event.stopPropagation()">Candidate</a></td></tr>`; }).join('') || '<tr><td colspan="5" class="empty">No events.</td></tr>'}
      </tbody></table></div></section>`);
  bindRows();
  $$('[data-at]').forEach(b => b.onclick = () => { f.type = b.dataset.at; hrActivity(); });
  const aq = $('#aq'); aq.oninput = () => { f.q = aq.value; const p = aq.selectionStart; hrActivity(); const n = $('#aq'); n.focus(); n.setSelectionRange(p, p); };
  $('#aexport').onclick = () => downloadCSV('activity-log.csv', [['Time', 'Candidate', 'Type', 'Event', 'Flagged'], ...list.map(e => [e.at.toISOString(), (DB.candidates.find(x => x.id === e.cid) || {}).name || '', e.type, e.text, e.warn ? 'yes' : ''])]);
}

/* ---------- reports ---------- */
function hrReports() {
  const rows = DB.drives.map(d => { const l = DB.candidates.filter(c => c.driveId === d.id); return { d, s: stats(l), n: l.length }; });
  const all = stats(DB.candidates);
  const dist = STATUS.map(([k, t]) => [t, DB.candidates.filter(c => c.status === k).length]).filter(x => x[1]);
  const max = Math.max(...dist.map(x => x[1]));
  hrShell('reports', `
    <header class="ph"><div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">All drives</span><h1>Reports &amp; export</h1></div>
      <div class="acts"><button class="btn" type="button" id="rx1">${I('download', 16)} Drive summary CSV</button><button class="btn gold" type="button" id="rx2">${I('download', 16)} Full candidate export</button></div></header>
    <section class="kpis">
      <div class="card kpi"><span>Completion rate</span><b class="n">${all.invited ? Math.round(all.submitted / all.invited * 100) : 0}%</b><span>${all.submitted} of ${all.invited} invited</span></div>
      <div class="card kpi"><span>Average MCQ score</span><b class="n">${all.avgMcq === null ? '—' : all.avgMcq.toFixed(1)}</b><span>out of ${DB.settings.mcq}</span></div>
      <div class="card kpi"><span>Shortlist rate</span><b class="n">${all.submitted ? Math.round(all.shortlisted / all.submitted * 100) : 0}%</b><span>of submitted assessments</span></div>
      <div class="card kpi hi"><span>Integrity flags</span><b class="n">${DB.candidates.filter(c => c.tabs).length}</b><span>${all.terminated} terminated</span></div>
    </section>
    <div class="split"><section class="card l" style="overflow:hidden"><div class="toolbar"><h2 style="font-size:16px;font-weight:700">By hiring drive</h2></div>
      <div class="tbl-wrap"><table class="tbl" style="min-width:720px"><thead><tr><th>Drive</th><th>Invited</th><th>Submitted</th><th>Completion</th><th>Avg MCQ</th><th>Shortlisted</th></tr></thead><tbody>
        ${rows.map(r => { const p = r.n ? Math.round(r.s.submitted / r.n * 100) : 0; return `<tr class="click" onclick="location.hash='#/hr/drive/${r.d.id}'"><td><b>${esc(r.d.college)}</b><br><small class="muted">${esc(r.d.name)}</small></td><td>${r.n}</td><td>${r.s.submitted}</td><td><div style="display:flex;align-items:center;gap:10px"><div class="prog" style="width:90px"><div style="width:${p}%"></div></div>${p}%</div></td><td>${r.s.avgMcq === null ? '—' : r.s.avgMcq.toFixed(1)}</td><td>${r.s.shortlisted}</td></tr>`; }).join('')}
      </tbody></table></div></section>
      <section class="card pad r" style="display:flex;flex-direction:column;gap:14px"><h2>Status distribution</h2>
        ${dist.map(([t, n]) => `<div style="display:flex;flex-direction:column;gap:6px;font-size:13px"><div style="display:flex;justify-content:space-between"><span style="color:var(--soft)">${t}</span><b>${n}</b></div><div class="prog" style="height:8px"><div style="width:${n / max * 100}%"></div></div></div>`).join('')}
      </section></div>`);
  $('#rx1').onclick = () => downloadCSV('drive-summary.csv', [['College', 'Drive', 'Invited', 'Submitted', 'Completion %', 'Avg MCQ', 'Shortlisted'], ...rows.map(r => [r.d.college, r.d.name, r.n, r.s.submitted, r.n ? Math.round(r.s.submitted / r.n * 100) : 0, r.s.avgMcq === null ? '' : r.s.avgMcq.toFixed(2), r.s.shortlisted])]);
  $('#rx2').onclick = () => downloadCSV('candidates-full.csv', [['Name', 'Email', 'College', 'Drive', 'Status', 'MCQ score', 'Written avg rating', 'Video rating', 'Tab switches', 'Submitted'], ...DB.candidates.map(c => { const r = Object.entries(c.ratings || {}).filter(([k]) => k !== 'video').map(x => x[1]); return [c.name, c.email, driveOf(c).college, driveOf(c).name, SL[c.status], c.mcq ? mcqScore(c) : '', r.length ? (r.reduce((a, b) => a + b, 0) / r.length).toFixed(1) : '', (c.ratings || {}).video || '', c.tabs || 0, c.submittedAt ? c.submittedAt.toISOString() : '']; })]);
}
function downloadCSV(name, rows) {
  const csv = rows.map(r => r.map(v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast(`Downloaded ${name}`);
}

/* ---------- users & roles ---------- */
function hrUsers() {
  hrShell('users', `
    <header class="ph"><div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">${DB.users.length} HR users</span><h1>Users &amp; roles</h1></div>
      <div class="acts"><button class="btn gold" type="button" id="adduser">${I('plus', 16)} Invite HR user</button></div></header>
    <div class="split"><section class="card l" style="overflow:hidden"><div class="tbl-wrap"><table class="tbl" style="min-width:640px"><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Last active</th><th></th></tr></thead><tbody>
      ${DB.users.map(u => `<tr><td><div class="who"><span class="avatar">${initials(u.name)}</span><div><b>${esc(u.name)}</b><small>${esc(u.email)}</small></div></div></td>
        <td><label class="sr" for="r-${u.id}">Role</label><select class="select" id="r-${u.id}" data-role="${u.id}" style="min-height:36px;width:auto"><option ${u.role === 'HR Admin' ? 'selected' : ''}>HR Admin</option><option ${u.role === 'HR Reviewer' ? 'selected' : ''}>HR Reviewer</option></select></td>
        <td><span class="pill ${u.status === 'Active' ? 'st-completed' : 'st-review'}">${u.status}</span></td><td class="muted">${u.last ? fmtDay(u.last) : '—'}</td>
        <td style="text-align:right">${u.status === 'Invited' ? `<button class="btn sm" type="button" onclick="toast('Invitation resent to ${esc(u.email)}.')">Resend</button>` : ''}</td></tr>`).join('')}
    </tbody></table></div></section>
    <section class="card pad r" style="display:flex;flex-direction:column;gap:18px"><h2>Role permissions</h2>
      <div style="display:flex;flex-direction:column;gap:6px"><b style="color:var(--gold2)">HR Admin</b><span class="muted" style="font-size:13px;line-height:1.6">Everything a reviewer can do, plus hiring drives, imports, question bank, assessment rules, exports and user management.</span></div>
      <div style="display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:1px solid var(--line)"><b>HR Reviewer</b><span class="muted" style="font-size:13px;line-height:1.6">View candidates, watch videos, rate answers, add notes and change candidate status.</span></div>
      <div style="padding-top:16px;border-top:1px solid var(--line);font-size:13px;line-height:1.6" class="muted">Every status change and sign-in is written to the audit trail.</div>
    </section></div>`);
  $$('[data-role]').forEach(s => s.onchange = () => { const u = DB.users.find(x => x.id === s.dataset.role); u.role = s.value; toast(`${esc(u.name)} is now ${u.role}.`); });
  $('#adduser').onclick = () => {
    openModal(`<div class="modal-h"><h2>Invite HR user</h2><button class="x" type="button" data-close aria-label="Close">${I('x', 16)}</button></div>
      <form id="uform" style="display:flex;flex-direction:column;gap:16px">
        <label class="field"><span>Full name</span><input class="input" id="un" required></label>
        <label class="field"><span>Work email</span><input class="input" id="ue" type="email" required placeholder="name@jurislpo.com"></label>
        <label class="field"><span>Role</span><select class="select" id="ur"><option>HR Reviewer</option><option>HR Admin</option></select></label>
        <div class="modal-f"><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn gold" type="submit">Send invite</button></div></form>`);
    $('#uform').onsubmit = e => { e.preventDefault(); const n = $('#un').value.trim(), em = $('#ue').value.trim(); if (!n || !/^\S+@\S+$/.test(em)) return toast('Add a name and a valid email.'); DB.users.push({ id: uid('u'), name: n, email: em, role: $('#ur').value, status: 'Invited', last: null }); closeModal(); toast(`Invite sent to ${esc(em)}.`); hrUsers(); };
  };
}

/* ---------- boot ---------- */
if (!location.hash) location.hash = '#/student/email';
route();
</script>
</body>
</html>
